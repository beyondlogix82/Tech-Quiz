name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows you to run this manually anytime

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova and Build Tools
        run: |
          npm install -g cordova

      - name: Prepare Assets Directory
        run: |
          mkdir -p www
          # Copy HTML, JS, CSS, and assets into www if they are in root
          find . -maxdepth 1 -type f \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" \) -exec cp {} www/ \; || true
          # If www/index.html doesn't exist yet, verify root index.html is moved
          if [ -f index.html ]; then cp -r index.html www/; fi

      - name: Add Android Platform
        run: |
          cordova platform add android

      - name: Build Debug APK
        run: |
          cordova build android --debug

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: platforms/android/app/build/outputs/apk/debug/*.apk
